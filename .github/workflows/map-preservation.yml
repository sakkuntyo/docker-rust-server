name: Map preservation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-map.txt
      - run: bash -n launch.sh
      - run: shellcheck --severity=error launch.sh
      - run: python -m unittest discover -s tests -v
